# Селекторы для парсинга цен на сайтах
sites:
  ETM:
    url: "https://www.etm.ru/catalog?searchValue={query}"
    price_selector: "p.MuiTypography-root[data-testid="catalog-list-item-price-details-0"]"
  Тинко:
    url: "https://www.tinko.ru/search/?q={query}"
    price_selector: 'span[itemprop="price"]'
  Luis:
    url: "https://luis.ru/catalog/search?searchString={query}"
    price_selector: ".QG9RHe > span:not([class])"
  Layta:
    url: "https://www.layta.ru/?digiSearch=true&term={query}"
    price_selector: "span[class="digi-product-price-variant digi-product-price-variant_actual"]
